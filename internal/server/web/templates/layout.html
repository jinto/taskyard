{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Taskyard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "media",
    theme: {
      extend: {
        colors: {
          ink: "#1C2127", muted: "#5F6B72", line: "#D9DDD6",
          go: { DEFAULT: "#0F6E56", soft: "#E3F1EA" },
          attention: { DEFAULT: "#C2410C", soft: "#FCE9DF" },
        },
        fontFamily: {
          sans: ["ui-sans-serif", "-apple-system", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "sans-serif"],
          mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
        },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer components {
    .field { @apply block text-sm; }
    .field > span { @apply block mb-1 text-muted dark:text-zinc-400; }
    .field input[type=text], .field input[type=number], .field textarea {
      @apply w-full rounded border border-line bg-white px-3 py-2 text-ink placeholder:text-zinc-400
             focus:outline-none focus:ring-2 focus:ring-go/40 focus:border-go
             dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100;
    }
    .field textarea { @apply font-mono text-[13px] leading-relaxed; }
    .check { @apply flex items-start gap-2 text-sm; }
    .check input { @apply mt-1 accent-go; }
    .btn { @apply inline-flex items-center rounded px-3 py-1.5 text-sm font-medium border border-line
                  bg-white text-ink hover:bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-go/40
                  dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-800; }
    .btn-primary { @apply bg-go text-white border-go hover:bg-go/90 dark:bg-go dark:border-go dark:hover:bg-go/90; }
    .btn-attention { @apply bg-attention text-white border-attention hover:bg-attention/90 dark:bg-attention dark:border-attention; }
    .badge { @apply inline-block rounded-full px-2 py-0.5 text-xs font-medium leading-5 align-middle; }
    .hint { @apply text-sm text-muted dark:text-zinc-400; }
    .hint code, .prose-code code { @apply font-mono text-[0.85em] rounded bg-zinc-100 px-1 py-0.5 dark:bg-zinc-800; }
    .row { @apply py-3 border-b border-line dark:border-zinc-800; }
    /* 보드는 촘촘하다. 카드는 떠 있는 상자가 아니라 목록의 행이고,
       그림자 대신 머리카락 굵기의 경계선으로 나뉜다. */
    .col { @apply flex min-h-0 flex-col rounded-lg border border-line bg-zinc-50/80
                  dark:border-zinc-800 dark:bg-zinc-900/50; }
    .col-head { @apply flex items-center gap-2 border-b border-line px-3 py-2 text-xs font-semibold
                       dark:border-zinc-800; }
    .cards { @apply min-h-0 flex-1 divide-y divide-line overflow-y-auto dark:divide-zinc-800; }
    .card { @apply px-3 py-2 hover:bg-white dark:hover:bg-zinc-800/50; }
    .card-title { @apply block text-[13px] font-medium leading-snug hover:underline; }
    .meta { @apply mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px] leading-4 text-muted; }
    .dot { @apply inline-block h-1.5 w-1.5 shrink-0 rounded-full; }
    /* 도는 아이콘. 러너가 그 이슈를 붙들고 있는 동안만 돈다. */
    .spinner { @apply inline-block h-2.5 w-2.5 shrink-0 animate-spin rounded-full border border-sky-500 border-t-transparent; }
    /* 카드가 말하는 한 줄. 길면 자른다 — 카드는 두 줄이 되지 않는다. */
    .line { @apply mt-0.5 truncate pl-3 text-[11px] leading-4 text-muted; }
    /* 사람을 기다리는 카드. 보드에서 유일하게 손이 필요한 카드다. */
    .card.wait { @apply bg-attention-soft dark:bg-attention/15; }
    .card.wait:hover { @apply bg-attention-soft dark:bg-attention/20; }
    h2.section { @apply mt-10 mb-3 text-base font-semibold; }
  }
</style>
</head>
<body class="min-h-screen bg-white font-sans text-[15px] leading-relaxed text-ink antialiased dark:bg-zinc-950 dark:text-zinc-100">
<header class="border-b border-line dark:border-zinc-800">
  <nav class="mx-auto flex h-12 {{if .Wide}}max-w-7xl{{else}}max-w-3xl{{end}} items-center gap-2 px-6 text-sm">
    <a href="/" class="font-semibold tracking-tight">Taskyard</a>
    {{block "crumbs" .}}{{end}}
  </nav>
</header>
<main class="mx-auto {{if .Wide}}max-w-7xl{{else}}max-w-3xl{{end}} px-6 py-8">
{{template "content" .}}
</main>
</body>
</html>{{end}}
