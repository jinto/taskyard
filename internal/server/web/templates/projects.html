{{define "content"}}
<h1>프로젝트</h1>

<form method="post" action="/projects" class="form">
  <label>키 <input type="text" name="key" placeholder="shop" pattern="[a-z0-9-]{1,32}" required></label>
  <label>이름 <input type="text" name="name" placeholder="쇼핑몰" required></label>
  <label>저장소 경로 <input type="text" name="repo_path" placeholder="/Users/me/code/shop" required></label>
  <label>기본 브랜치 <input type="text" name="default_branch" placeholder="main"></label>
  <button type="submit">프로젝트 만들기</button>
  <p class="state">저장소 경로는 러너 머신의 절대 경로이며, 러너의 <code>--allow-repo</code> 목록에 있어야 합니다.</p>
</form>

{{range .Projects}}
  <div class="run">
    <a href="/projects/{{.Key}}">{{.Name}}</a>
    <div class="state">{{.Key}} · {{.RepoPath}} · {{.DefaultBranch}}</div>
  </div>
{{else}}
  <p class="state">아직 프로젝트가 없습니다.</p>
{{end}}
{{end}}
