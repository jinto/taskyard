{{define "content"}}
<h1 class="text-2xl font-semibold tracking-tight">프로젝트</h1>
<p class="hint mt-1">저장소 하나에 이슈 보드와 실행 설정을 붙인 단위입니다.</p>

<h2 class="section">프로젝트 목록</h2>
{{range .Projects}}
  <div class="row flex items-baseline justify-between gap-4">
    <a href="/projects/{{.Key}}" class="font-medium text-go hover:underline">{{.Name}}</a>
    <span class="hint truncate font-mono text-xs">{{.RepoPath}}</span>
  </div>
{{else}}
  <p class="hint">아직 프로젝트가 없습니다. 아래에서 첫 프로젝트를 만드세요.</p>
{{end}}

<h2 class="section">새 프로젝트</h2>
<form method="post" action="/projects" class="max-w-xl space-y-4">
  <label class="field"><span>키</span><input type="text" name="key" placeholder="shop" pattern="[a-z0-9-]{1,32}" required></label>
  <label class="field"><span>이름</span><input type="text" name="name" placeholder="쇼핑몰" required></label>
  <label class="field"><span>저장소 경로</span><input type="text" name="repo_path" placeholder="/Users/me/code/shop" required></label>
  <p class="hint -mt-2">러너 머신의 절대 경로이며, 러너의 <code>--allow-repo</code> 목록에 있어야 합니다.</p>
  <label class="field"><span>기본 브랜치</span><input type="text" name="default_branch" placeholder="main"></label>
  <label class="check"><input type="checkbox" name="create_pr" checked> <span>PR 만들기<br><span class="hint">실행이 성공하면 러너가 push하고 PR을 엽니다. 원격이 있는 저장소만.</span></span></label>
  <label class="check"><input type="checkbox" name="cleanup_merged" checked> <span>merge 후 worktree 삭제</span></label>
  <button type="submit" class="btn btn-primary">프로젝트 만들기</button>
</form>
{{end}}
